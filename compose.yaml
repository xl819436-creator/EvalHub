services:
  evalhub:
    build: .
    image: evalhub:day20
    container_name: evalhub
    ports:
      - "8000:8000"
    environment:
      - EVALHUB_DB_PATH=/app/data/evalhub.db
    volumes:
      - evalhub_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  evalhub_data: